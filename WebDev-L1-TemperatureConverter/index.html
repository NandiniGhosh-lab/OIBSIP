<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Temperature Converter</h1>
    <p class="subtitle">Convert between Celsius, Fahrenheit & Kelvin</p>

    <div class="input-group">
      <label for="tempValue">Enter Temperature</label>
      <input type="text" id="tempValue" placeholder="e.g. 25">
    </div>

    <div class="input-group">
      <label for="unitFrom">From Unit</label>
      <select id="unitFrom">
        <option value="C">Celsius (°C)</option>
        <option value="F">Fahrenheit (°F)</option>
        <option value="K">Kelvin (K)</option>
      </select>
    </div>

    <button id="convertBtn">Convert</button>

    <p id="errorMsg" class="error"></p>

    <div class="results" id="results">
      <div class="result-box">
        <span class="result-label">Celsius</span>
        <span id="resC" class="result-value">--</span>
      </div>
      <div class="result-box">
        <span class="result-label">Fahrenheit</span>
        <span id="resF" class="result-value">--</span>
      </div>
      <div class="result-box">
        <span class="result-label">Kelvin</span>
        <span id="resK" class="result-value">--</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
