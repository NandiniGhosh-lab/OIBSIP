<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --error: #dc2626;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  h1 { font-size: 1.5rem; margin: 0 0 6px; text-align: center; }
  p.subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin: 0 0 28px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  .row { margin-bottom: 18px; }
  input[type="number"], select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    color: var(--text);
    background: #fafafa;
  }
  input[type="number"]:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    background: #fff;
  }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: var(--accent-dark); }
  .error { color: var(--error); font-size: 0.85rem; margin-top: 8px; min-height: 18px; }
  .results { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .result-box { background: #f0f5ff; border: 1px solid #d8e6ff; border-radius: 8px; padding: 12px 8px; text-align: center; }
  .result-box .unit { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  .result-box .value { font-size: 1.1rem; font-weight: 700; color: var(--accent-dark); word-break: break-word; }
  @media (max-width: 400px) { .results { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="card">
  <h1>Temperature Converter</h1>
  <p class="subtitle">Convert between Celsius, Fahrenheit and Kelvin</p>

  <div class="row">
    <label for="tempValue">Enter temperature</label>
    <input type="number" id="tempValue" placeholder="e.g. 25" step="any">
  </div>

  <div class="row">
    <label for="tempUnit">From unit</label>
    <select id="tempUnit">
      <option value="C">Celsius (°C)</option>
      <option value="F">Fahrenheit (°F)</option>
      <option value="K">Kelvin (K)</option>
    </select>
  </div>

  <button onclick="convertTemperature()">Convert</button>
  <div class="error" id="errorMsg"></div>

  <div class="results" id="results" style="display:none;">
    <div class="result-box">
      <div class="unit">Celsius</div>
      <div class="value" id="outC">--</div>
    </div>
    <div class="result-box">
      <div class="unit">Fahrenheit</div>
      <div class="value" id="outF">--</div>
    </div>
    <div class="result-box">
      <div class="unit">Kelvin</div>
      <div class="value" id="outK">--</div>
    </div>
  </div>
</div>

<script>
function convertTemperature() {
  const inputEl = document.getElementById('tempValue');
  const unitEl = document.getElementById('tempUnit');
  const errorEl = document.getElementById('errorMsg');
  const resultsEl = document.getElementById('results');

  const rawValue = inputEl.value.trim();
  errorEl.textContent = '';
  resultsEl.style.display = 'none';

  if (rawValue === '' || isNaN(rawValue)) {
    errorEl.textContent = 'Please enter a valid numeric temperature.';
    return;
  }

  const value = parseFloat(rawValue);
  const unit = unitEl.value;

  let celsius;
  if (unit === 'C') {
    celsius = value;
  } else if (unit === 'F') {
    celsius = (value - 32) * (5 / 9);
  } else if (unit === 'K') {
    celsius = value - 273.15;
  }

  if (celsius < -273.15) {
    errorEl.textContent = 'Temperature cannot be below absolute zero (-273.15°C).';
    return;
  }

  const fahrenheit = celsius * (9 / 5) + 32;
  const kelvin = celsius + 273.15;

  document.getElementById('outC').textContent = celsius.toFixed(2) + ' °C';
  document.getElementById('outF').textContent = fahrenheit.toFixed(2) + ' °F';
  document.getElementById('outK').textContent = kelvin.toFixed(2) + ' K';

  resultsEl.style.display = 'grid';
}
</script>

</body>
</html>
